name: SAC Retorno Intelligence - Homologacao Integrada
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Testar todas as frentes sem dados sensiveis
        run: |
          node tests/test_prd_static.mjs
          node tests/test_html_production.mjs
          node tests/test_unified_operator_flow.mjs
          node tests/test_distribution_operator_profiles.mjs
          node tests/test_contingency_boot.mjs
          node tests/test_cloud_shared_sync.mjs
          node --check assets/sri-connection-status.js
          node tests/test_connection_status.mjs
          node tests/test_auto_publish.mjs
          node tests/test_auto_import_context.mjs
          node tests/test_operational_automation_20h.mjs
          node tests/test_prd_reset.mjs
          node tests/test_import_timestamp.mjs
          node tests/test_turno_display_labels.mjs
          node tests/test_csv_integrity.mjs
          node tests/test_p1_authorization.mjs
          node tests/test_p1_closure_guard.mjs
          node tests/test_p1_pdf_reports.mjs
          node tests/test_p2_retention.mjs
          node tests/test_homologacao_integrada.mjs
          node tests/test_p03_critical_release.mjs
          node tests/test_p03_filters.mjs
      - name: Instalar PostgreSQL isolado para as migrações históricas
        run: npm install --prefix /tmp/sri-postgres --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.6.0
      - name: Validar migrações históricas e permissões em PostgreSQL sintético
        env:
          SRI_PGLITE_MODULE: /tmp/sri-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node tests/test_p03_postgres.mjs
      - name: Verificar layouts integrados de todos os modulos em dados sinteticos
        env:
          SRI_CAPTURE_INTEGRATED_SCREENSHOT: '1'
        run: node tests/test_visual_integrated_layout.mjs
      - name: Anexar capturas de revisao visual integrada
        uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-integrada-dados-sinteticos
          path: .tmp/visual-integrada/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Validar layout do login e cadastro no Chromium
        env:
          SRI_CAPTURE_LOGIN_SCREENSHOT: '1'
        run: node tests/test_login_signup_layout.mjs
      - name: Anexar capturas do cadastro responsivo
        uses: actions/upload-artifact@v4
        with:
          name: login-cadastro-layout-sintetico
          path: .tmp/login-signup-*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Instalar verificadores A4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Gerar e validar PDFs sintéticos
        env:
          SRI_RENDER_PDF_FIXTURES: '1'
        run: node tests/test_p1_pdf_reports.mjs
      - name: Anexar amostras A4 para inspecao
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-integrada-relatorios-a4-sinteticos
          path: .tmp/p1-pdf/*.pdf
          if-no-files-found: error
          retention-days: 7
